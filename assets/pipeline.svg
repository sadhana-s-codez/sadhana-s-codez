<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Workflow: Extract, Clean, Structure, Visualize">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FB2E5"/>
    </marker>
    <style>
      .flow { stroke-dasharray: 6 6; animation: move 2.5s linear infinite; }
      @keyframes move { to { stroke-dashoffset: -24; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1000" height="200" rx="16" fill="#0B1F3A"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="36" font-size="12" letter-spacing="3" fill="#7FB2E5">FROM RAW DATA TO INSIGHT</text>

    <rect x="30" y="58" width="190" height="104" rx="12" fill="#14304F" stroke="#2F5D8C"/>
    <circle cx="54" cy="82" r="11" fill="#2F5D8C"/><text x="54" y="87" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="74" y="87" font-size="20" font-weight="700" fill="#FFFFFF">Extract</text>
    <text x="46" y="122" font-size="13" fill="#9CCBF2">REST APIs · Drive</text>
    <text x="46" y="142" font-size="13" fill="#9CCBF2">ZIP files · Websites</text>

    <rect x="280" y="58" width="190" height="104" rx="12" fill="#14304F" stroke="#2F5D8C"/>
    <circle cx="304" cy="82" r="11" fill="#2F5D8C"/><text x="304" y="87" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="324" y="87" font-size="20" font-weight="700" fill="#FFFFFF">Clean</text>
    <text x="296" y="122" font-size="13" fill="#9CCBF2">Pandas · duplicates</text>
    <text x="296" y="142" font-size="13" fill="#9CCBF2">Missing values · types</text>

    <rect x="530" y="58" width="190" height="104" rx="12" fill="#14304F" stroke="#2F5D8C"/>
    <circle cx="554" cy="82" r="11" fill="#2F5D8C"/><text x="554" y="87" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="574" y="87" font-size="20" font-weight="700" fill="#FFFFFF">Structure</text>
    <text x="546" y="122" font-size="13" fill="#9CCBF2">Retries · logging</text>
    <text x="546" y="142" font-size="13" fill="#9CCBF2">Structured CSV output</text>

    <rect x="780" y="58" width="190" height="104" rx="12" fill="#14304F" stroke="#4FB3E8"/>
    <circle cx="804" cy="82" r="11" fill="#2F8FC8"/><text x="804" y="87" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="824" y="87" font-size="20" font-weight="700" fill="#FFFFFF">Visualize</text>
    <text x="796" y="122" font-size="13" fill="#9CCBF2">Power BI · DAX</text>
    <text x="796" y="142" font-size="13" fill="#9CCBF2">KPI cards · slicers</text>

    <line class="flow" x1="224" y1="110" x2="276" y2="110" stroke="#7FB2E5" stroke-width="2" marker-end="url(#arrow)"/>
    <line class="flow" x1="474" y1="110" x2="526" y2="110" stroke="#7FB2E5" stroke-width="2" marker-end="url(#arrow)"/>
    <line class="flow" x1="724" y1="110" x2="776" y2="110" stroke="#7FB2E5" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
