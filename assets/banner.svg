<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Sadhana S - Data Engineering, Analytics, Software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.6" stop-color="#1F3A5F"/>
      <stop offset="1" stop-color="#2F5D8C"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7FD6FF" stop-opacity="0.08"/>
    </linearGradient>
    <style>
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 1.1s ease-out both; }
      .b2 { animation-delay: .08s } .b3 { animation-delay: .16s } .b4 { animation-delay: .24s }
      .b5 { animation-delay: .32s } .b6 { animation-delay: .40s }
      .trend { stroke-dasharray: 1; animation: draw 1.6s ease-out .5s both; }
      @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .bar, .trend { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#dots)"/>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="56" y="104" font-size="58" font-weight="800" letter-spacing="2" fill="#FFFFFF">SADHANA S</text>
    <text x="58" y="140" font-size="16" letter-spacing="3" fill="#9CCBF2">DATA ENGINEERING  ·  ANALYTICS  ·  SOFTWARE</text>
    <text x="58" y="186" font-size="21" fill="#E8F1FA">I build Python data pipelines and turn</text>
    <text x="58" y="214" font-size="21" fill="#E8F1FA">messy data into clear dashboards.</text>
    <rect x="56" y="234" width="188" height="30" rx="15" fill="#2EA44F" fill-opacity="0.2" stroke="#3FB950" stroke-opacity="0.7"/>
    <circle cx="76" cy="249" r="5" fill="#3FB950"/>
    <text x="90" y="254" font-size="14" fill="#D6F5DC">Open to Collaborations </text>
  </g>

  <!-- chart motif -->
  <line x1="640" y1="250" x2="944" y2="250" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <rect class="bar b1" x="660" y="190" width="28" height="60" rx="4" fill="url(#bar)"/>
  <rect class="bar b2" x="708" y="155" width="28" height="95" rx="4" fill="url(#bar)"/>
  <rect class="bar b3" x="756" y="170" width="28" height="80" rx="4" fill="url(#bar)"/>
  <rect class="bar b4" x="804" y="120" width="28" height="130" rx="4" fill="url(#bar)"/>
  <rect class="bar b5" x="852" y="140" width="28" height="110" rx="4" fill="url(#bar)"/>
  <rect class="bar b6" x="900" y="90" width="28" height="160" rx="4" fill="url(#bar)"/>
  <polyline class="trend" pathLength="1" points="674,170 722,135 770,150 818,100 866,120 914,70" fill="none" stroke="#9CE3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#7FD6FF" stroke-width="2">
    <circle cx="674" cy="170" r="5"/><circle cx="722" cy="135" r="5"/><circle cx="770" cy="150" r="5"/>
    <circle cx="818" cy="100" r="5"/><circle cx="866" cy="120" r="5"/><circle cx="914" cy="70" r="5"/>
  </g>
</svg>
